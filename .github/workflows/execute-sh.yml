name: Build and verify site

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Locate Chrome or Chromium
        shell: bash
        run: |
          CHROMIUM_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROMIUM_BIN" ]; then
            echo "Chrome/Chromium executable not found" >&2
            exit 1
          fi
          "$CHROMIUM_BIN" --version
          echo "CHROMIUM_BIN=$CHROMIUM_BIN" >> "$GITHUB_ENV"

      - name: Build and run the quality gate
        run: npm run check

      - name: Verify generated assets are committed on pull requests
        if: github.event_name == 'pull_request'
        run: |
          GENERATED_STATUS="$(git status --porcelain -- \
            assets/data/directories.json \
            assets/data/content-index.json \
            assets/pagefind \
            dist/cv.html \
            dist/cv.pdf)"
          if [ -n "$GENERATED_STATUS" ]; then
            echo "$GENERATED_STATUS"
            echo "Generated assets are stale. Run npm run build and commit the result." >&2
            exit 1
          fi

      - name: Upload verified generated assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: generated-site-assets
          retention-days: 1
          if-no-files-found: error
          path: |
            assets/data/directories.json
            assets/data/content-index.json
            assets/pagefind
            dist/cv.html
            dist/cv.pdf

  update-generated-assets:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download verified generated assets
        uses: actions/download-artifact@v4
        with:
          name: generated-site-assets
          path: .generated-assets

      - name: Synchronize verified generated assets
        shell: bash
        run: |
          cp .generated-assets/assets/data/directories.json assets/data/directories.json
          cp .generated-assets/assets/data/content-index.json assets/data/content-index.json
          cp .generated-assets/dist/cv.html dist/cv.html
          cp .generated-assets/dist/cv.pdf dist/cv.pdf
          rsync --archive --delete .generated-assets/assets/pagefind/ assets/pagefind/

      - name: Commit generated assets when changed
        shell: bash
        run: |
          git add \
            assets/data/directories.json \
            assets/data/content-index.json \
            assets/pagefind \
            dist/cv.html \
            dist/cv.pdf
          if git diff --cached --quiet; then
            echo "Generated assets are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update generated site assets"
          git push origin HEAD:main
