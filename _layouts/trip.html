<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  {% include head.html extra_css='/assets/css/photo_grid.css' %}
</head>
<body class="trip-layout">
{% include site-header.html %}
<main id="main-content" tabindex="-1" data-pagefind-body class="page-content diary-content">
  <div class="trip-wrapper">
    {% include note-context.html %}
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}
    <p class="trip-subtitle">{{ page.subtitle }}</p>
    {% endif %}
    {{ content }}
    <div id="trip-diary"
         data-trip-url="{{ page.data_source | default: page.data_url | relative_url }}">
      <p class="diary-loading">Loading diary...</p>
    </div>
  </div>
</main>
{% include site-footer.html %}
{% include back-to-top.html %}
<script src="{{ '/assets/js/trip_diary.js' | relative_url }}"></script>
<script src="{{ '/assets/js/script.js' | relative_url }}"></script>
<script src="{{ '/assets/js/catalog.js' | relative_url }}"></script>
<script src="{{ '/assets/js/note-context.js' | relative_url }}"></script>
</body>
</html>
