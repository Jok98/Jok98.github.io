<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  {% include head.html extra_css='/assets/css/anime_list.css' %}
</head>
<body class="anime-layout">
{% include site-header.html %}
<main id="main-content" tabindex="-1" data-pagefind-body class="anime-main">
  <div class="anime-wrapper">
    {% include note-context.html %}
    <h1 class="anime-title">{{ page.title }}</h1>
    {{ content }}
  </div>
</main>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const toggleAllButton = document.getElementById('toggle-all');

    if (toggleAllButton) {
      toggleAllButton.addEventListener('click', () => {
        const detailsElements = document.querySelectorAll('details');
        if (!detailsElements.length) {
          return;
        }

        const allOpen = Array.from(detailsElements).every(details => details.open);

        detailsElements.forEach(details => {
          details.open = !allOpen;
        });

        toggleAllButton.textContent = allOpen ? 'Expand All' : 'Collapse All';
      });
    }

    const searchInput = document.getElementById('anime-search');
    if (searchInput) {
      searchInput.addEventListener('input', () => {
        const searchQuery = searchInput.value.toLowerCase();
        const detailsElements = document.querySelectorAll('details');

        detailsElements.forEach(details => {
          const gallery = details.querySelector('.anime-gallery');
          const cards = gallery.querySelectorAll('.anime-card');
          let hasVisibleCard = false;

          cards.forEach(card => {
            const title = card.querySelector('.anime-card__title').textContent.toLowerCase();
            if (title.includes(searchQuery)) {
              card.style.display = 'flex';
              hasVisibleCard = true;
            } else {
              card.style.display = 'none';
            }
          });

          if (hasVisibleCard) {
            details.style.display = 'block';
          } else {
            details.style.display = 'none';
          }
        });
      });
    }
  });
</script>
{% include site-footer.html %}
{% include back-to-top.html %}
<script src="{{ '/assets/js/script.js' | relative_url }}"></script>
<script src="{{ '/assets/js/catalog.js' | relative_url }}"></script>
<script src="{{ '/assets/js/note-context.js' | relative_url }}"></script>
</body>
</html>
